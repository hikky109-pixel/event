name: Daily Sunday Folk Live Info

on:
  schedule:
    - cron: '0 17 * * *'     # 日本時間 毎日 2:00（UTC 17:00）
  workflow_dispatch:         # 手動実行ボタン

jobs:
  post-live-info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests python-dotenv

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Sunday Folk Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Job Summary
        run: |
          echo "✅ 投稿完了"
          echo "日時: $(date '+%Y-%m-%d %H:%M:%S JST')"
          echo "トリガー: ${{ github.event_name }}"
